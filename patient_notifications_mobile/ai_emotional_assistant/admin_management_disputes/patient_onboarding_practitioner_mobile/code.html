<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>M-Santé Finance - Patient Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#191c1e",
                        "tertiary-container": "#cbcdcf",
                        "secondary": "#705d00",
                        "outline": "#6f787e",
                        "on-surface": "#0b1c30",
                        "secondary-fixed": "#ffe170",
                        "background": "#f8f9ff",
                        "outline-variant": "#bec8ce",
                        "on-primary-fixed-variant": "#004d65",
                        "on-primary-fixed": "#001f2a",
                        "surface-dim": "#cbdbf5",
                        "primary-fixed-dim": "#7bd1f8",
                        "on-tertiary-container": "#545759",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#0b1c30",
                        "secondary-fixed-dim": "#e4c546",
                        "primary": "#006685",
                        "tertiary-fixed-dim": "#c4c7c9",
                        "surface-container-low": "#eff4ff",
                        "on-secondary": "#ffffff",
                        "surface-tint": "#006685",
                        "on-secondary-container": "#756100",
                        "surface-container-high": "#dce9ff",
                        "on-secondary-fixed": "#221b00",
                        "surface-container": "#e5eeff",
                        "inverse-on-surface": "#eaf1ff",
                        "surface-container-highest": "#d3e4fe",
                        "surface": "#f8f9ff",
                        "on-primary-container": "#005e7a",
                        "error-container": "#ffdad6",
                        "secondary-container": "#ffde5c",
                        "primary-fixed": "#bee9ff",
                        "on-error": "#ffffff",
                        "on-surface-variant": "#3f484d",
                        "surface-variant": "#d3e4fe",
                        "inverse-primary": "#7bd1f8",
                        "primary-container": "#82d8ff",
                        "on-tertiary-fixed-variant": "#444749",
                        "surface-bright": "#f8f9ff",
                        "tertiary-fixed": "#e0e3e5",
                        "tertiary": "#5c5f61",
                        "on-secondary-fixed-variant": "#544600",
                        "inverse-surface": "#213145",
                        "on-tertiary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "stack-gap": "12px",
                        "gutter": "16px",
                        "card-padding": "20px",
                        "margin-page": "24px"
                    },
                    "fontFamily": {
                        "label-caps": ["Manrope"],
                        "headline-md": ["Manrope"],
                        "body-base": ["Manrope"],
                        "display-lg": ["Manrope"],
                        "body-sm": ["Manrope"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-base": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 102, 133, 0.05);
        }
        .inner-glow {
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.5);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-base antialiased min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="fixed top-0 w-full flex items-center justify-between px-6 h-16 bg-white/80 dark:bg-slate-950/80 backdrop-blur-xl docked full-width top-0 z-40 border-b border-slate-200/50 dark:border-slate-800/50 shadow-sm shadow-sky-500/5 font-manrope antialiased tracking-tight">
<div class="flex items-center gap-4">
<button class="text-sky-400 dark:text-sky-300 active:scale-95 duration-200 hover:bg-sky-50/50 dark:hover:bg-sky-900/20 transition-colors p-2 rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">menu</span>
</button>
<h1 class="text-xl font-bold text-sky-500 dark:text-sky-300 tracking-tighter">M-Santé Finance</h1>
</div>
<div>
<div class="w-8 h-8 rounded-full bg-surface-container-high overflow-hidden border border-outline-variant flex items-center justify-center">
<img alt="Admin Profile" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDQ4U-Q8x9-tEHC3RD6NVEmPgG7KOgYZqXini2_HWNxrysUYJoIo84yDUQaZ9vZ-5dOi_g7XYN4qaWB0gmKeikwgD9GWLZa6AmadW_lAvPIptDPv4WPj4s7k2EDf2DYn7A0Tceus-Jh7OcQ_-sk5nOIqE4dU1X16ppP3umSJ0yoCi2Av-vY2eCnIDqvQon--3YDNPJZ_4NguTJhKPx2xgJ8YLNtLKfinjPUiOGULc3GzK9kLInZzdJb-xY6NYhKqOVFze99cM7ln46g"/>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 mt-16 mb-20 px-margin-page py-6 max-w-3xl mx-auto w-full flex flex-col gap-stack-gap">
<!-- Header Section -->
<div class="mb-4">
<div class="flex items-center gap-2 mb-2 text-primary font-label-caps text-label-caps">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">person_add</span>
<span>STEP 1 OF 3</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface">Basic Info</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Please enter the patient's primary contact details.</p>
</div>
<!-- Quick Add / Scan Card -->
<div class="glass-card rounded-xl p-card-padding flex items-center gap-4 inner-glow cursor-pointer hover:bg-surface-container-lowest transition-colors active:scale-[0.98]">
<div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">document_scanner</span>
</div>
<div class="flex-1">
<h3 class="font-body-base font-semibold text-on-surface">Quick Add via ID Scan</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Scan local ID to auto-fill details</p>
</div>
<div class="text-primary">
<span class="material-symbols-outlined">chevron_right</span>
</div>
</div>
<div class="flex items-center gap-4 py-2">
<div class="flex-1 h-px bg-outline-variant/30"></div>
<span class="font-label-caps text-label-caps text-outline">OR ENTER MANUALLY</span>
<div class="flex-1 h-px bg-outline-variant/30"></div>
</div>
<!-- Form Fields -->
<form class="flex flex-col gap-stack-gap">
<!-- Full Name -->
<div class="glass-card rounded-xl p-1 inner-glow focus-within:ring-2 focus-within:ring-primary/20 transition-all">
<div class="px-4 py-2 bg-surface-container-lowest/50 rounded-lg">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-1" for="fullName">FULL NAME</label>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-base text-body-base text-on-surface placeholder-outline-variant" id="fullName" placeholder="e.g. Aissatou Diallo" type="text"/>
</div>
</div>
<!-- Phone Number -->
<div class="glass-card rounded-xl p-1 inner-glow focus-within:ring-2 focus-within:ring-primary/20 transition-all">
<div class="px-4 py-2 bg-surface-container-lowest/50 rounded-lg">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-1" for="phone">PHONE NUMBER</label>
<div class="flex items-center gap-2">
<span class="font-body-base text-on-surface-variant border-r border-outline-variant/30 pr-2">+221</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-base text-body-base text-on-surface placeholder-outline-variant" id="phone" placeholder="77 123 45 67" type="tel"/>
</div>
</div>
</div>
<!-- Language Preferences -->
<div class="mt-4">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-3">PREFERRED LANGUAGE</label>
<div class="flex flex-wrap gap-3">
<label class="relative flex items-center justify-center px-4 py-2 rounded-full border border-primary text-primary bg-primary-container/20 cursor-pointer transition-all active:scale-95">
<input checked="" class="sr-only" name="language" type="radio" value="wolof"/>
<span class="font-body-sm font-medium">Wolof</span>
</label>
<label class="relative flex items-center justify-center px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant bg-surface-container-lowest/50 cursor-pointer transition-all hover:bg-surface-container-low active:scale-95">
<input class="sr-only" name="language" type="radio" value="french"/>
<span class="font-body-sm font-medium">French</span>
</label>
<label class="relative flex items-center justify-center px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant bg-surface-container-lowest/50 cursor-pointer transition-all hover:bg-surface-container-low active:scale-95">
<input class="sr-only" name="language" type="radio" value="english"/>
<span class="font-body-sm font-medium">English</span>
</label>
</div>
</div>
<!-- Submit Button Area (Fixed at bottom before nav) -->
<div class="mt-8">
<button class="w-full bg-primary text-on-primary font-body-base font-semibold py-4 rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-transform flex items-center justify-center gap-2" type="button">
<span>Next: Medical History</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</form>
</main>
<!-- BottomNavBar -->
<nav class="lg:hidden fixed bottom-0 w-full flex justify-around items-center px-4 py-3 pb-safe z-50 bg-white/70 dark:bg-slate-950/70 backdrop-blur-lg docked full-width bottom-0 rounded-t-2xl border-t border-slate-200/50 dark:border-slate-800/50 shadow-[0_-10px_30px_rgba(130,216,255,0.1)]">
<!-- Item 1: Finance -->
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 hover:text-sky-400 tap-highlight-transparent active:scale-90 w-16" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">dashboard</span>
<span class="font-manrope text-[10px] font-bold uppercase tracking-widest text-center truncate w-full">Finance</span>
</a>
<!-- Item 2: History -->
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 hover:text-sky-400 tap-highlight-transparent active:scale-90 w-16" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">payments</span>
<span class="font-manrope text-[10px] font-bold uppercase tracking-widest text-center truncate w-full">History</span>
</a>
<!-- Item 3: Onboard (Active) -->
<a class="flex flex-col items-center justify-center text-sky-500 dark:text-sky-300 bg-sky-50/50 dark:bg-sky-900/20 rounded-xl px-3 py-1 tap-highlight-transparent active:scale-90 w-16" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">person_add</span>
<span class="font-manrope text-[10px] font-bold uppercase tracking-widest text-center truncate w-full">Onboard</span>
</a>
<!-- Item 4: User -->
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 hover:text-sky-400 tap-highlight-transparent active:scale-90 w-16" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">account_circle</span>
<span class="font-manrope text-[10px] font-bold uppercase tracking-widest text-center truncate w-full">User</span>
</a>
</nav>
</body></html>
