<body class="bg-surface text-on-surface h-screen overflow-hidden flex flex-col font-body-base bg-gradient-to-br from-surface-bright to-surface-container-low">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-6 py-4 bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl border-b border-sky-100/20 shadow-[0_8px_32px_0_rgba(130,216,255,0.08)]">
<div class="flex items-center gap-4">
<span class="text-2xl font-bold bg-gradient-to-r from-sky-600 to-sky-400 bg-clip-text text-transparent font-headline-md tracking-tight">M-Santé</span>
<div class="hidden md:flex items-center gap-2 bg-surface-container/50 px-3 py-1.5 rounded-full border border-surface-variant">
<span class="w-2 h-2 rounded-full bg-primary shadow-[0_0_8px_rgba(0,102,133,0.5)]"></span>
<span class="text-on-surface-variant font-label-caps text-label-caps uppercase">Secure Connection</span>
</div>
</div>
<div class="flex items-center gap-4">
<div class="text-center">
<span class="block text-on-surface-variant font-label-caps text-label-caps uppercase">Time Elapsed</span>
<span class="block text-primary font-headline-md text-headline-md tabular-nums">14:23</span>
</div>
<div class="h-8 w-px bg-outline-variant/50 mx-2"></div>
<button class="p-2 text-sky-500 dark:text-sky-300 hover:bg-sky-50/50 dark:hover:bg-sky-900/30 transition-colors rounded-full scale-95 duration-200 ease-in-out">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
</button>
<button class="p-2 text-sky-500 dark:text-sky-300 hover:bg-sky-50/50 dark:hover:bg-sky-900/30 transition-colors rounded-full scale-95 duration-200 ease-in-out">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">account_circle</span>
</button>
</div>
</header>
<!-- Side Nav & Main Content Wrapper -->
<div class="flex h-full pt-[72px]">
<!-- Side Navigation (Suppressed on this specific screen as per guidelines for focused tasks, but the structure is implied if it were a dashboard. We will use a Right Sidebar for specific task content instead as requested.) -->
<!-- Main Workspace -->
<main class="flex-1 flex flex-col lg:flex-row gap-gutter p-gutter md:p-margin-page h-full relative z-10">
<!-- Video Canvas -->
<div class="flex-1 relative rounded-xl overflow-hidden bg-inverse-surface shadow-2xl shadow-sky-900/10 border border-white/10 group flex flex-col">
<!-- Large Video Feed -->
<img alt="Practitioner Video Feed" class="absolute inset-0 w-full h-full object-cover" data-alt="A high-quality, professional video feed of a doctor (Dr. Julian Vane) in a modern, well-lit clinical office. The doctor is wearing a clean white coat over a light blue shirt, looking directly at the camera with a reassuring, calm expression. The background is slightly blurred, featuring clean white walls, a subtle abstract art piece, and soft natural light from a window, embodying a serene 'Medical Futurism' aesthetic with soft blue and pristine white tones." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAf7bQCGYUulqY8StkvpripcbjabLnKwLEu8a9nwSkXu5YSOb42TAgsLsvjHyZES_XdSzKVpKM5OEf0KIG6W6_F6zXCILDwubmvvz6Kbf9kCikanFQrPC_UiwrHx5T2xFe7SgID7vpBl_KgcUB38D4GeYsbbmJTmhUDPUvlptQGWdblx3Bf6FW2aTWDEE4lWR4cgZRvZslX4WIyMaVnhu8ubvkiOVBU7usTcDVjJdswKJyEUD4jDML1rhx2xbRTp3DUDOtpidaVRuS0"/>
<!-- Video Overlay Gradient -->
<div class="absolute inset-0 bg-gradient-to-t from-inverse-surface/80 via-transparent to-transparent pointer-events-none"></div>
<!-- Self View -->
<div class="absolute top-card-padding right-card-padding w-32 h-40 md:w-48 md:h-64 rounded-xl overflow-hidden border-2 border-white/20 shadow-lg z-20 backdrop-blur-md bg-white/10 transition-transform duration-300 hover:scale-105 cursor-move">
<img alt="Patient Self View" class="w-full h-full object-cover" data-alt="A clear, well-lit self-view video feed of a female patient looking attentive and relaxed. She is in a tidy, softly lit domestic environment with neutral, calming tones. The image has a clean, high-definition quality, consistent with a premium telehealth application, maintaining a serene and professional mood." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBqMZj5knhLwchLpIPZfJCcSrE8LC1aN0thbgEdv2kopLLgntY5x_Oajw4OJTDTyL8lP5VnxaMitTAL5borXrOXAAFwvLBjHstffr551qN9qvX-XB2RjcIlUxjKmC0RNURbTd27zTgQJc4zwCCulqWvv6oy7p0FN90WBI-ogu-CSd4F0PqRn9mNThykCCJTxwDe36H5P25jAqCbQO8twVKGrVS0qVrn7AvuzpPP8rcFCvv7alJQ6kIp6YsAirnWS9kndXcyL9aStKNH"/>
<div class="absolute bottom-2 left-2 bg-black/50 backdrop-blur-md px-2 py-1 rounded text-white font-label-caps text-[10px] flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-green-400"></span> You
                    </div>
</div>
<!-- Doctor Info Overlay -->
<div class="absolute top-card-padding left-card-padding z-20">
<div class="bg-inverse-surface/60 backdrop-blur-md border border-white/10 rounded-lg p-3 flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-headline-md text-sm shadow-inner">
                            JV
                        </div>
<div>
<h2 class="text-white font-headline-md text-base leading-tight">Dr. Julian Vane</h2>
<p class="text-white/70 font-body-sm text-xs">Mental Health Specialist</p>
</div>
</div>
</div>
<!-- Floating Control Bar -->
<div class="absolute bottom-card-padding left-1/2 transform -translate-x-1/2 z-30 flex items-center gap-stack-gap bg-inverse-surface/70 backdrop-blur-xl border border-white/15 px-6 py-3 rounded-full shadow-[0_20px_40px_rgba(0,0,0,0.2)]">
<button class="w-12 h-12 rounded-full flex items-center justify-center bg-white/10 hover:bg-white/20 text-white transition-all duration-200" title="Mute Microphone">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">mic</span>
</button>
<button class="w-12 h-12 rounded-full flex items-center justify-center bg-white/10 hover:bg-white/20 text-white transition-all duration-200" title="Turn Off Camera">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">videocam</span>
</button>
<button class="w-12 h-12 rounded-full flex items-center justify-center bg-white/10 hover:bg-white/20 text-white transition-all duration-200" title="Share Screen">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">screen_share</span>
</button>
<div class="w-px h-8 bg-white/20 mx-2"></div>
<button class="px-6 h-12 rounded-full flex items-center justify-center bg-error hover:bg-error/90 text-on-error font-headline-md text-sm transition-all duration-200 shadow-[0_0_15px_rgba(186,26,26,0.3)]">
<span class="material-symbols-outlined mr-2" style="font-variation-settings: 'FILL' 1;">call_end</span>
                        End Session
                    </button>
</div>
</div>
<!-- Right Sidebar: Notes & Chat -->
<div class="w-full lg:w-80 flex flex-col gap-gutter z-20">
<!-- Session Notes Card -->
<div class="flex-1 bg-white/40 dark:bg-slate-900/40 backdrop-blur-2xl rounded-xl border border-white/40 shadow-xl shadow-sky-900/5 p-card-padding flex flex-col">
<div class="flex items-center justify-between mb-4">
<h3 class="font-headline-md text-headline-md text-on-surface text-lg">Session Notes</h3>
<button class="text-primary hover:text-primary-fixed-dim transition-colors">
<span class="material-symbols-outlined text-sm">edit</span>
</button>
</div>
<div class="flex-1 relative">
<textarea class="w-full h-full absolute inset-0 resize-none bg-white/50 border border-outline-variant/50 rounded-lg p-3 text-on-surface-variant font-body-sm focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary/50 transition-all" placeholder="Jot down key points from the consultation here..."></textarea>
</div>
</div>
<!-- Secure Chat Card -->
<div class="h-1/2 min-h-[300px] bg-white/40 dark:bg-slate-900/40 backdrop-blur-2xl rounded-xl border border-white/40 shadow-xl shadow-sky-900/5 flex flex-col overflow-hidden">
<div class="p-4 border-b border-white/20 bg-surface-container-low/50 backdrop-blur-md">
<h3 class="font-headline-md text-on-surface text-base flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm">lock</span>
                            Secure Chat
                        </h3>
</div>
<div class="flex-1 p-4 overflow-y-auto flex flex-col gap-4">
<!-- Message Bubble (Doctor) -->
<div class="flex gap-3">
<div class="w-8 h-8 rounded-full bg-primary-container shrink-0 flex items-center justify-center text-on-primary-container font-headline-md text-xs">JV</div>
<div class="bg-surface-container py-2 px-3 rounded-lg rounded-tl-none border border-white/50 max-w-[85%]">
<p class="text-on-surface font-body-sm text-sm">Hello, I've shared the assessment form link.</p>
<span class="text-[10px] text-outline font-label-caps mt-1 block">14:15</span>
</div>
</div>
<!-- Message Bubble (Patient) -->
<div class="flex gap-3 flex-row-reverse">
<div class="bg-primary text-on-primary py-2 px-3 rounded-lg rounded-tr-none max-w-[85%] shadow-sm shadow-primary/20">
<p class="font-body-sm text-sm">Thank you, I will fill it out now.</p>
<span class="text-[10px] text-primary-container font-label-caps mt-1 block text-right">14:16</span>
</div>
</div>
</div>
<div class="p-3 bg-surface-container-low/50 border-t border-white/20 flex gap-2 items-center">
<button class="text-outline hover:text-primary transition-colors p-1">
<span class="material-symbols-outlined text-xl">attach_file</span>
</button>
<input class="flex-1 bg-white/50 border border-outline-variant/50 rounded-full px-4 py-2 text-sm font-body-sm focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary/50 text-on-surface" placeholder="Type a message..." type="text"/>
<button class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center hover:bg-surface-tint transition-colors shadow-sm shadow-primary/30">
<span class="material-symbols-outlined text-sm">send</span>
</button>
</div>
</div>
</div>
</main>
</div>
</body></html>
