<button class="text-sky-500 dark:text-sky-300 hover:bg-sky-50/50 dark:hover:bg-sky-900/20 transition-all duration-300 ease-in-out active:scale-95 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-manrope font-semibold tracking-tight text-lg font-bold text-sky-600 dark:text-sky-400">Consultation</h1>
<button class="text-slate-500 dark:text-slate-400 hover:bg-sky-50/50 dark:hover:bg-sky-900/20 transition-all duration-300 ease-in-out active:scale-95 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">more_vert</span>
</button>
</header>
<!-- Secondary Header: Timer & Security Badge (Glassmorphic) -->
<div class="absolute top-[80px] left-0 w-full flex justify-center z-40 px-margin-page pointer-events-none">
<div class="flex items-center gap-stack-gap bg-surface-container-lowest/60 backdrop-blur-[16px] px-4 py-2 rounded-full shadow-[0_4px_30px_rgba(0,102,133,0.1)] border border-white/50 pointer-events-auto">
<div class="flex items-center gap-1.5 text-primary font-label-caps">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">lock</span>
<span>Secure</span>
</div>
<div class="w-[1px] h-4 bg-outline-variant/40"></div>
<div class="text-on-surface font-body-sm font-medium tracking-wide">14:23</div>
</div>
</div>

</div>

<span class="material-symbols-outlined transition-transform group-hover:scale-110" style="font-variation-settings: 'FILL' 1;">chat</span>
</button>
<!-- Floating Bottom Control Bar (Glassmorphic) -->
<div class="absolute bottom-margin-page left-0 w-full z-40 flex justify-center px-margin-page pointer-events-none">
<div class="flex items-center justify-between gap-3 md:gap-6 bg-surface-container-lowest/60 backdrop-blur-[24px] px-6 py-4 rounded-[2.5rem] shadow-[0_16px_40px_rgba(0,102,133,0.15)] border border-white/60 w-full max-w-sm pointer-events-auto">
<!-- Mute Button -->
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-low/80 text-on-surface hover:bg-primary hover:text-on-primary transition-colors shadow-sm border border-white/40">
<span class="material-symbols-outlined text-[22px]">mic</span>
</button>
<!-- Video Toggle Button -->
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-low/80 text-on-surface hover:bg-primary hover:text-on-primary transition-colors shadow-sm border border-white/40">
<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">videocam</span>
</button>

<span class="material-symbols-outlined text-[22px]">cameraswitch</span>
</button>

<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">call_end</span>
</button>

      linear/transactional "Task-Focused" screen (active video call) where the global navigation
