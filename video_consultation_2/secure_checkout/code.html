<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>M-Santé - Secure Checkout</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    "on-surface": "#0b1c30",
                    "on-tertiary": "#ffffff",
                    "primary-fixed": "#bee9ff",
                    "on-tertiary-fixed-variant": "#444749",
                    "surface-container-lowest": "#ffffff",
                    "error-container": "#ffdad6",
                    "tertiary-fixed": "#e0e3e5",
                    "secondary-fixed-dim": "#e4c546",
                    "on-tertiary-container": "#545759",
                    "inverse-on-surface": "#eaf1ff",
                    "tertiary": "#5c5f61",
                    "outline": "#6f787e",

                    "surface-dim": "#cbdbf5",

            "borderRadius": {

            "spacing": {
                    "margin-page": "24px",
                    "gutter": "16px",
                    "unit": "8px",
                    "stack-gap": "12px",
                    "card-padding": "20px"
            },
            "fontFamily": {
                    "body-sm": [

                    ],
                    "label-caps": [

                    "display-lg": [

                    "body-base": [

                    "headline-md": [

            },
            "fontSize": {
                    "body-sm": [

                    "label-caps": [
                            "12px",

                    ],
                    "display-lg": [

<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar for horizontal lists */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-base antialiased min-h-screen relative overflow-x-hidden flex flex-col">
<!-- Ambient Background Blobs for Glassmorphism Depth -->
<div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
<div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-primary-container/20 rounded-full blur-[100px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[60vw] h-[60vw] bg-surface-variant/40 rounded-full blur-[120px]"></div>
</div>
<!-- TopAppBar (Shared Component Translated) -->
<header class="bg-white/70 dark:bg-slate-900/70 backdrop-blur-lg flex items-center justify-between px-6 py-4 w-full sticky top-0 z-50 docked full-width border-b border-white/20 dark:border-slate-800/50 shadow-[0_8px_32px_0_rgba(130,216,255,0.08)] ring-1 ring-white/10 ring-inset">
<!-- Leading Icon -->
<button class="w-10 h-10 flex items-center justify-center rounded-full text-sky-400 dark:text-sky-300 hover:bg-sky-50/50 dark:hover:bg-sky-900/20 transition-colors active:scale-95 duration-200 ease-out">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<!-- Headline -->
<h1 class="font-['Manrope'] font-bold text-lg tracking-tight text-sky-400 dark:text-sky-300">
<span class="font-black text-xl tracking-tighter">M-Santé</span>
</h1>
<!-- Trailing Avatar -->
<button class="w-10 h-10 rounded-full overflow-hidden border border-white/40 shadow-sm active:scale-95 duration-200 ease-out flex-shrink-0">
<img alt="User profile avatar" class="w-full h-full object-cover" data-alt="A close-up, high-quality portrait of a calm, professional individual with neutral lighting. The background is a very soft, minimal, light-mode gray. The overall aesthetic is highly polished, serene, and fits perfectly within a premium digital health sanctuary environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuByvgQUsyQS2jpiH2VtP8iAvMPTApxbZH0wgKXFFAlaFWWvRkhWnFoe6sbQ2RYKV-kgW6anEIIQzrpp6L5V4AmZdi46g3ZKvgnd3PTTH5-z0b6DmaXPAJgrXIqpBe1_mFgQ5q0hME_lZhLXMOiQHtZLd0QtqQPyjPdBLu4PaH6T06x25zblFErAZjufhBjK4Am3JE1WyprMtezthntBXPfUSc1F2nMBvwGkfyIHZ6MlHfUbGVh-mvZ3Q4ZRw3Tf-PxkHTqgkaT6wxRI"/>
</button>
</header>
<!-- Main Content Canvas (Z-10 to sit above ambient background) -->
<main class="relative z-10 flex-grow px-margin-page py-6 flex flex-col gap-stack-gap max-w-lg mx-auto w-full">
<!-- Amount Display -->
<section class="flex flex-col items-center justify-center py-4 mb-2">
<p class="font-body-sm text-body-sm text-outline mb-1">Total Payment</p>
<h2 class="font-display-lg text-display-lg text-primary tracking-tight">$125.00</h2>
</section>
<!-- Payment Method Categories Bento -->
<section class="flex flex-col gap-unit">
<h3 class="font-body-base text-body-base font-semibold text-on-surface">Payment Method</h3>
<div class="flex gap-unit overflow-x-auto no-scrollbar pb-2">
<!-- Mobile Money (Active) -->
<button class="flex-shrink-0 bg-white/60 backdrop-blur-md border border-primary/30 rounded-xl px-4 py-3 flex items-center gap-2 shadow-[0_8px_24px_rgba(0,102,133,0.06)] ring-1 ring-white/50 ring-inset active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">smartphone</span>
<span class="font-body-sm text-body-sm font-semibold text-primary">Mobile Money</span>
</button>
<!-- Card (Inactive) -->
<button class="flex-shrink-0 bg-white/40 backdrop-blur-md border border-white/40 rounded-xl px-4 py-3 flex items-center gap-2 shadow-sm ring-1 ring-white/50 ring-inset active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined text-outline text-[20px]">credit_card</span>
<span class="font-body-sm text-body-sm font-medium text-outline">Card</span>
</button>
<!-- Bank Transfer (Inactive) -->
<button class="flex-shrink-0 bg-white/40 backdrop-blur-md border border-white/40 rounded-xl px-4 py-3 flex items-center gap-2 shadow-sm ring-1 ring-white/50 ring-inset active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined text-outline text-[20px]">account_balance</span>
<span class="font-body-sm text-body-sm font-medium text-outline">Bank Transfer</span>
</button>
</div>
</section>
<!-- Provider Selection (Sub-options for Mobile Money) -->
<section class="grid grid-cols-2 gap-stack-gap mt-2">
<!-- Wave (Active Default) -->
<button class="relative bg-white/80 backdrop-blur-xl rounded-xl p-card-padding border border-primary/40 shadow-[0_12px_32px_rgba(0,102,133,0.08)] flex flex-col items-center justify-center gap-3 ring-1 ring-white/80 ring-inset active:scale-95 transition-all duration-200 overflow-hidden">
<!-- Active Indicator Blob -->
<div class="absolute top-0 right-0 w-12 h-12 bg-primary/10 rounded-bl-full translate-x-4 -translate-y-4"></div>
<div class="absolute top-2 right-2 w-4 h-4 rounded-full bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[12px]" style="font-variation-settings: 'wght' 700;">check</span>
</div>
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-primary font-bold text-lg">
                    W
                </div>
<span class="font-body-base text-body-base font-semibold text-on-surface">Wave</span>
</button>
<!-- Orange Money (Inactive) -->
<button class="relative bg-white/40 backdrop-blur-md rounded-xl p-card-padding border border-white/50 shadow-sm flex flex-col items-center justify-center gap-3 ring-1 ring-white/50 ring-inset active:scale-95 transition-all duration-200 grayscale-[0.2] opacity-80 hover:opacity-100">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-orange-500 font-bold text-lg">
                    O
                </div>
<span class="font-body-base text-body-base font-medium text-outline">Orange</span>
</button>
</section>
<!-- Input Field Container -->
<section class="mt-4 flex flex-col gap-unit">
<label class="font-body-sm text-body-sm font-medium text-on-surface" for="mobile-number">Mobile Number</label>
<div class="relative flex items-center bg-white/60 backdrop-blur-lg rounded-xl border border-outline-variant/50 shadow-inner overflow-hidden focus-within:border-primary focus-within:ring-1 focus-within:ring-primary/30 transition-all duration-200">
<!-- Country Code Selector (Simulated) -->
<button class="flex items-center gap-1 pl-4 pr-3 py-3 border-r border-outline-variant/30 bg-surface-container-low/50 active:bg-surface-container-high/50 transition-colors">
<span class="font-body-base text-body-base font-medium text-on-surface">+221</span>
<span class="material-symbols-outlined text-outline text-[18px]">expand_more</span>
</button>
<!-- Number Input -->
<input class="flex-grow bg-transparent border-none outline-none px-4 py-3 font-body-base text-body-base text-on-surface placeholder:text-outline/50 w-full focus:ring-0" id="mobile-number" placeholder="77 123 45 67" type="tel"/>
<!-- Validation Icon (Optional visually) -->
<span class="material-symbols-outlined text-primary text-[20px] pr-4 opacity-0 focus-within:opacity-100 transition-opacity">dialpad</span>
</div>
</section>
<!-- Spacer to push button down if needed -->
<div class="flex-grow"></div>
<!-- Checkout Actions Container (Sticky to bottom conceptually, but flows naturally in this minimal layout) -->
<section class="mt-8 flex flex-col items-center gap-4 w-full">
<!-- Trust Badge -->
<div class="flex items-center gap-2 bg-surface-container/50 backdrop-blur-sm px-3 py-1.5 rounded-full border border-white/50">
<span class="material-symbols-outlined text-primary text-[14px]">gpp_good</span>
<span class="font-label-caps text-label-caps text-primary tracking-widest">256-BIT ENCRYPTED</span>
</div>
<!-- Primary Action Button -->
<button class="w-full bg-primary hover:bg-surface-tint text-on-primary rounded-xl py-4 px-6 flex items-center justify-center gap-2 shadow-[0_12px_24px_rgba(0,102,133,0.2)] active:scale-[0.98] transition-all duration-200 ease-in-out relative overflow-hidden group">
<!-- Subtle internal reflection/glow -->
<div class="absolute inset-0 bg-gradient-to-t from-black/10 to-transparent"></div>
<div class="absolute top-0 left-0 right-0 h-1/2 bg-white/10 rounded-t-xl"></div>
<span class="material-symbols-outlined text-[20px] relative z-10" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-body-base text-body-base font-bold relative z-10">Pay $125.00</span>
</button>
</section>
</main>
</body></html>
